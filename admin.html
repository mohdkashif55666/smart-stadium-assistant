<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Staff Dashboard - Smart Stadium</title>
    <link rel="stylesheet" href="style.css">
    <script
        src="https://maps.googleapis.com/maps/api/js?key=AIzaSyCv1xTjU0pC_gMo7oJe6_y53XuBPX9PhNI&callback=initAdminMap&libraries=visualization"
        async defer></script>
</head>

<body>
    <div class="container">
        <h1>🎛️ Venue Control Dashboard</h1>
        <div id="map" style="height: 400px;"></div>
        <div id="admin-controls">
            <h3>Update Crowd Level</h3>
            <select id="zone-select">
                <option value="gate_a">Gate A</option>
                <option value="concessions">Main Concessions</option>
                <option value="restrooms">Restrooms East</option>
            </select>
            <select id="crowd-select">
                <option value="low">🟢 Low</option>
                <option value="medium">🟠 Medium</option>
                <option value="high">🔴 High</option>
            </select>
            <button id="update-crowd">Update</button>
        </div>
        <div id="queue-management">
            <h3>Manage Queues</h3>
            <select id="queue-zone">
                <option value="gate_a">Gate A Queue</option>
                <option value="concessions">Concessions Queue</option>
                <option value="restrooms">Restrooms Queue</option>
            </select>
            <button id="call-next">Call Next Person</button>
            <div id="queue-list"></div>
        </div>
    </div>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="admin.js"></script>
</body>

</html>
