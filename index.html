<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Stadium Assistant</title>
    <link rel="stylesheet" href="style.css">
    <script
        src="https://maps.googleapis.com/maps/api/js?key=AIzaSyCv1xTjU0pC_gMo7oJe6_y53XuBPX9PhNI&callback=initMap&libraries=visualization"
        async defer></script>
</head>

<body>
    <div class="container">
        <h1>🏟️ Smart Stadium Assistant</h1>
        <div id="map"></div>
        <div id="info-panel">
            <h3>📍 Selected Zone: <span id="zone-name">None</span></h3>
            <p>🚶 Crowd Level: <span id="crowd-level">—</span></p>
            <p>⏱️ Est. Wait Time: <span id="wait-time">—</span></p>
            <button id="join-queue-btn" disabled>Join Digital Queue</button>
            <div id="queue-status"></div>
        </div>
    </div>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-messaging-compat.js"></script>
    <script src="app.js"></script>
</body>

</html>
